name: build-firmware

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO and esptool
        run: pip install platformio esptool

      - name: Build
        run: pio run -e esp32-s3

      - name: Merge into one image for the web flasher (flash at 0x0)
        run: |
          B=.pio/build/esp32-s3
          BOOT_APP0=$(find ~/.platformio/packages/framework-arduinoespressif32 -name boot_app0.bin | head -1)
          python -m esptool --chip esp32s3 merge_bin -o SmartResistance-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0 $B/bootloader.bin 0x8000 $B/partitions.bin 0xe000 "$BOOT_APP0" 0x10000 $B/firmware.bin

      - uses: actions/upload-artifact@v4
        with:
          name: SmartResistance-firmware
          path: |
            SmartResistance-merged.bin
            .pio/build/esp32-s3/firmware.bin
            .pio/build/esp32-s3/bootloader.bin
            .pio/build/esp32-s3/partitions.bin
