<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<title>智能电阻箱</title>
<style>
:root{--bg:#0b1220;--card:#172133;--inset:#0f1828;--line:#26334d;--fg:#e5e9f0;--dim:#8b97ab;--acc:#2a9df4;--good:#4ade80;--warn:#fbbf24;--bad:#f87171;--on:#16a34a}
@media (prefers-color-scheme: light){:root{--bg:#eef2f7;--card:#fff;--inset:#f3f6fa;--line:#dde3ec;--fg:#0f172a;--dim:#64748b;--acc:#0b84d8;--good:#16a34a;--warn:#b45309;--bad:#dc2626}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:12px 14px calc(24px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:10px;margin:4px 2px 12px}
header h1{font-size:19px;margin:0;flex:1}
.badge{font-size:12px;padding:3px 9px;border-radius:99px;background:var(--inset);color:var(--dim);border:1px solid var(--line)}
.badge.ok{color:var(--good)}.badge.bad{color:var(--bad)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card h2{font-size:14px;color:var(--dim);font-weight:600;margin:0 0 10px;display:flex;justify-content:space-between}
.big{font:600 42px/1.1 "DIN Alternate","Bahnschrift",ui-monospace,monospace;letter-spacing:.5px}
.unit{font-size:20px;color:var(--dim);margin-left:4px}
.sub{color:var(--dim);font-size:13px;margin-top:2px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
input,select{flex:1;min-width:0;font-size:16px;padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--fg)}
button{font-size:15px;padding:11px 14px;border-radius:12px;border:0;background:var(--inset);color:var(--fg);border:1px solid var(--line);cursor:pointer}
button:active{transform:scale(.97)}
button.acc{background:var(--acc);color:#fff;border-color:transparent}
button.on{background:var(--on);color:#fff;border-color:transparent}
button:disabled{opacity:.45}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.chips button{padding:9px 0;font-size:14px}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.steps button{padding:10px 0;font-size:16px}
.toggle{width:100%;margin-top:12px;padding:14px;font-size:17px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv{background:var(--inset);border-radius:12px;padding:9px 11px}
.kv b{display:block;font-size:18px;font-weight:600;margin-top:1px}
.kv span{font-size:12px;color:var(--dim)}
.soc{display:flex;align-items:center;gap:14px;margin-bottom:10px}
.bat{width:64px;height:32px;border:3px solid var(--fg);border-radius:7px;position:relative;padding:3px}
.bat:after{content:"";position:absolute;right:-8px;top:8px;width:4px;height:10px;background:var(--fg);border-radius:2px}
.bat i{display:block;height:100%;border-radius:3px;background:var(--good);width:0}
pre{background:var(--inset);border-radius:12px;padding:10px;margin:10px 0 0;font-size:12px;white-space:pre-wrap;word-break:break-all;max-height:180px;overflow:auto;color:var(--dim)}
#connect{display:none;width:100%;padding:16px;font-size:17px;font-weight:600}
.hide{display:none!important}
.note{font-size:12px;color:var(--dim);margin-top:8px}
.field{flex:1;min-width:0;text-align:left;font-size:16px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--inset);color:var(--dim)}
.field.set{color:var(--fg)}
.quick{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.quick button{padding:7px 10px;font-size:13px}
#sheet{position:fixed;inset:0;display:none;z-index:10}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(0,0,0,.45)}
#sheet .pad{position:absolute;left:0;right:0;bottom:0;background:var(--card);border-radius:18px 18px 0 0;padding:14px 14px calc(14px + env(safe-area-inset-bottom));max-width:560px;margin:0 auto;border:1px solid var(--line)}
#sheet .title{color:var(--dim);font-size:13px;display:flex;justify-content:space-between}
#sheet .disp{font:600 34px/1.2 "DIN Alternate","Bahnschrift",ui-monospace,monospace;min-height:44px;margin:4px 0 10px;word-break:break-all}
#sheet .keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
#sheet .keys button{padding:15px 0;font-size:20px}
#sheet .keys button.ok{background:var(--acc);color:#fff;border-color:transparent;font-size:17px}
</style>
</head>
<body>
<main>
<header><h1>智能电阻箱</h1><span id="link" class="badge">未连接</span></header>

<button id="connect" class="acc">连接蓝牙</button>
<div id="bleHelp" class="card hide"><h2>蓝牙连接</h2>
<div class="note">用 Chrome（安卓 / 电脑）打开本页，点上面的按钮选择 SmartR-XXXX。iPhone 的 Safari 不支持网页蓝牙，请用 App Store 里的 Bluefy 浏览器打开本页。也可以手机连板子热点（SmartR-XXXX，密码 12345678）后打开 http://192.168.4.1。</div></div>

<section id="app" class="hide">
<div class="card">
  <h2><span>电阻</span><span id="mode"></span></h2>
  <div><span class="big" id="rv">-</span><span class="unit">Ω</span></div>
  <div class="sub" id="est">-</div>
  <div class="row"><button id="rin" class="field" onclick="openPad('r')">点这里输入阻值（4700、4.7k、1M）</button></div>
  <div class="chips"><button onclick="cmd('R 100')">100</button><button onclick="cmd('R 1k')">1k</button><button onclick="cmd('R 4.7k')">4.7k</button><button onclick="cmd('R 10k')">10k</button><button onclick="cmd('R 100k')">100k</button></div>
  <div class="steps"><button onclick="stepR(-100)">−100</button><button onclick="stepR(-1)">−1</button><button onclick="stepR(1)">+1</button><button onclick="stepR(100)">+100</button></div>
  <button id="out" class="toggle" onclick="toggleOut()">输出：关</button>
</div>

<div class="card">
  <h2><span>NTC 温度</span><span id="ntcName"></span></h2>
  <div><span class="big" id="tv">-</span><span class="unit">°C</span></div>
  <div class="sub" id="ntcInfo">-</div>
  <div class="row"><select id="ntcSel" onchange="cmd('NTCSEL '+this.value)"></select></div>
  <div class="row"><button id="tin" class="field" onclick="openPad('t')">点这里输入温度 °C</button></div>
  <div class="steps"><button onclick="stepT(-1)">−1</button><button onclick="stepT(-.1)">−0.1</button><button onclick="stepT(.1)">+0.1</button><button onclick="stepT(1)">+1</button></div>
</div>

<div class="card hide" id="pbCard">
  <h2><span>充电宝</span><span id="pbLink"></span></h2>
  <div class="soc"><div class="bat"><i id="pbBar"></i></div><span class="big" id="pbSoc">-</span><span class="unit">%</span></div>
  <div class="grid2">
    <div class="kv"><span>电压</span><b id="pbV">-</b></div><div class="kv"><span>电流</span><b id="pbI">-</b></div>
    <div class="kv"><span>功率</span><b id="pbP">-</b></div><div class="kv"><span>温度</span><b id="pbT">-</b></div>
    <div class="kv"><span>健康度</span><b id="pbH">-</b></div><div class="kv"><span>循环</span><b id="pbC">-</b></div>
  </div>
</div>

<div class="card">
  <h2><span>设备</span><span id="ver"></span></h2>
  <div class="grid2">
    <div class="kv"><span>板温</span><b id="board">-</b></div><div class="kv"><span>网络</span><b id="net">-</b></div>
    <div class="kv"><span>USB 口</span><b id="usb">-</b></div><div class="kv"><span>蓝牙键盘</span><b id="hid">-</b></div>
  </div>
</div>

<div class="card">
  <h2><span>指令</span><span></span></h2>
  <div class="row" style="margin-top:0"><input id="cin" type="text" placeholder="例如 HELP、STAT?、R 4.7k" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false" enterkeyhint="send"><button onclick="sendCin()">发送</button></div>
  <div class="quick"><button onclick="cmd('STAT?')">STAT?</button><button onclick="cmd('TEMP?')">TEMP?</button><button onclick="cmd('PB?')">PB?</button><button onclick="cmd('HID?')">HID?</button><button onclick="cmd('ANCS?')">ANCS?</button><button onclick="cmd('HELP')">HELP</button></div>
  <pre id="log"></pre>
</div>
</section>
</main>
<div id="sheet"><div class="back" onclick="closePad()"></div><div class="pad">
  <div class="title"><span id="padTitle"></span><span id="padHint"></span></div>
  <div class="disp" id="padDisp"></div>
  <div class="keys" id="padKeys"></div>
</div></div>
<script>
"use strict";
const NUS = "6e400001-b5a3-f393-e0a9-e50e24dcca9e", RX = "6e400002-b5a3-f393-e0a9-e50e24dcca9e", TX = "6e400003-b5a3-f393-e0a9-e50e24dcca9e";
const $ = id => document.getElementById(id);
let link = null, st = {}, typesShown = "", polling = false;

// Wi-Fi: the page comes from the board itself; commands go to /api.
const httpLink = {
  name: "Wi-Fi",
  async cmd(c) { const r = await fetch("/api/cmd?c=" + encodeURIComponent(c)); return (await r.text()).trim(); },
  async state() { return (await fetch("/api/state")).json(); }
};

// Bluetooth (Web Bluetooth, HTTPS page): Nordic UART service, one command at a time; a reply ends
// after 150 ms without data (replies may span several lines).
const bleLink = {
  name: "蓝牙", rx: null, buf: "", last: 0, chain: Promise.resolve(),
  async open() {
    const dev = await navigator.bluetooth.requestDevice({filters: [{namePrefix: "SmartR"}], optionalServices: [NUS]});
    dev.addEventListener("gattserverdisconnected", () => { setLink("蓝牙已断开", "bad"); $("connect").style.display = "block"; });
    const svc = await (await dev.gatt.connect()).getPrimaryService(NUS);
    this.rx = await svc.getCharacteristic(RX);
    const tx = await svc.getCharacteristic(TX);
    tx.addEventListener("characteristicvaluechanged", e => { this.buf += new TextDecoder().decode(e.target.value); this.last = Date.now(); });
    await tx.startNotifications();
  },
  cmd(c) {
    const run = async () => {
      this.buf = ""; this.last = 0;
      const data = new TextEncoder().encode(c + "\n");
      for (let i = 0; i < data.length; i += 180) await this.rx.writeValueWithoutResponse(data.slice(i, i + 180));
      const t0 = Date.now();
      while (true) {
        await new Promise(r => setTimeout(r, 30));
        if (this.last && Date.now() - this.last > 150) break;
        if (!this.last && Date.now() - t0 > 2500) break;
      }
      return this.buf.trim();
    };
    const p = this.chain.then(run, run);
    this.chain = p.catch(() => {});
    return p;
  },
  async state() { return JSON.parse(await this.cmd("STATE?")); }
};

function setLink(text, cls) { const b = $("link"); b.textContent = text; b.className = "badge " + (cls || ""); }
function log(line) { const l = $("log"); l.textContent = (line + "\n" + l.textContent).slice(0, 4000); }

async function cmd(c) {
  if (!link) return "";
  try { const r = await link.cmd(c); log("> " + c + "\n" + (r || "(无回复)")); poll(); return r; }
  catch (e) { log("! " + e); return ""; }
}
function parseOhms(s) {
  const m = String(s).trim().toLowerCase().match(/^([\d.]+)\s*([km]?)/);
  if (!m) return NaN;
  return parseFloat(m[1]) * (m[2] === "k" ? 1e3 : m[2] === "m" ? 1e6 : 1);
}
function stepR(d) { const v = Math.max(0, Math.min(999999, (st.r || 0) + d)); cmd("R " + v); }
function stepT(d) { const base = st.mode === "NTC" ? st.t : 25; cmd("NTC " + (Math.round((base + d) * 10) / 10)); }

// In-page keypad: value entry works in every browser (some iOS web views never raise the system
// keyboard for inputs), and it has the k / M unit keys a phone's number pad lacks.
let pad = null, padText = "";
const PADS = {
  r: {title: "设置阻值 Ω", hint: "0 ~ 999999", keys: ["7", "8", "9", "⌫", "4", "5", "6", "k", "1", "2", "3", "M", "0", ".", "清空", "设置"],
      ok: t => { if (t) cmd("R " + t); }},
  t: {title: "NTC 温度 °C", hint: "-40 ~ 150", keys: ["7", "8", "9", "⌫", "4", "5", "6", "−", "1", "2", "3", "清空", "0", ".", "取消", "应用"],
      ok: t => { const v = parseFloat(t.replace("−", "-")); if (!isNaN(v)) cmd("NTC " + v); }}
};
function openPad(kind) {
  pad = PADS[kind]; padText = "";
  $("padTitle").textContent = pad.title; $("padHint").textContent = pad.hint;
  const keys = $("padKeys"); keys.innerHTML = "";
  pad.keys.forEach(k => {
    const b = document.createElement("button");
    b.textContent = k;
    if (k === "设置" || k === "应用") b.className = "ok";
    b.onclick = () => padKey(k);
    keys.appendChild(b);
  });
  padShow();
  $("sheet").classList.add("open");
}
function closePad() { $("sheet").classList.remove("open"); pad = null; }
function padShow() { $("padDisp").textContent = padText || " "; }
function padKey(k) {
  if (!pad) return;
  if (k === "设置" || k === "应用") { const p = pad, t = padText; closePad(); p.ok(t); return; }
  if (k === "取消") { closePad(); return; }
  if (k === "清空") padText = "";
  else if (k === "⌫") padText = padText.slice(0, -1);
  else if (k === "−") padText = padText.startsWith("−") ? padText.slice(1) : "−" + padText;
  else if (k === "k" || k === "M") { if (padText && !/[kM]$/.test(padText)) padText += k; }
  else if (k === ".") { if (!padText.includes(".")) padText += padText ? "." : "0."; }
  else if (padText.length < 9 && !/[kM]$/.test(padText)) padText += k;
  padShow();
}
document.addEventListener("keydown", e => {        // computers: type on the keypad
  if (!pad) return;
  const map = {Backspace: "⌫", Escape: "取消", Enter: pad.keys.includes("设置") ? "设置" : "应用", "-": "−", K: "k", m: "M"};
  const k = map[e.key] || e.key;
  if (pad.keys.includes(k)) { e.preventDefault(); padKey(k); }
});
function toggleOut() { cmd("OUT " + (st.out ? 0 : 1)); }
function sendCin() { const c = $("cin").value.trim(); if (c) { cmd(c); $("cin").value = ""; } }
$("cin").addEventListener("keydown", e => { if (e.key === "Enter") sendCin(); });

function fmt(v, d) { return v === null || v === undefined || isNaN(v) ? "-" : Number(v).toFixed(d); }

function render() {
  $("rv").textContent = st.r !== undefined ? Number(st.r).toLocaleString("en-US") : "-";
  $("est").textContent = st.mode === "RAW" ? "继电器手动模式" : "实际 " + fmt(st.est, 3) + " Ω" + (st.lock ? "  · 已锁定" : "") + (st.fault ? "  · 故障" : "");
  $("mode").textContent = {R: "电阻模式", NTC: "NTC 模式", RAW: "手动"}[st.mode] || "";
  const out = $("out"); out.textContent = st.out ? "输出：开" : "输出：关"; out.className = "toggle" + (st.out ? " on" : "");
  $("tv").textContent = st.mode === "NTC" ? fmt(st.t, 1) : "-";
  $("ntcInfo").textContent = "R25 " + fmt(st.r25, 0) + " Ω · B " + fmt(st.beta, 0) + (st.mode === "NTC" ? "" : " · 未应用");
  const types = (st.types || []).join("|");
  if (types && types !== typesShown) {
    typesShown = types;
    const sel = $("ntcSel"); sel.innerHTML = "";
    st.types.forEach((n, i) => sel.add(new Option(i === st.types.length - 1 ? "自定义 " + n : n, i)));
  }
  if (document.activeElement !== $("ntcSel")) $("ntcSel").value = st.ntc;
  $("ntcName").textContent = (st.types || [])[st.ntc] || "";
  $("board").textContent = st.board === null || st.board === undefined ? "-" : fmt(st.board, 1) + " °C";
  $("net").textContent = st.wifi === "STA" ? st.ip : st.wifi === "AP" ? "热点 " + st.ip : "未连接";
  $("usb").textContent = st.usb === "PBANK" ? "连充电宝" : "连电脑";
  $("hid").textContent = st.hid ? "已连接 " + st.hid + " 台" : "未连接";
  $("ver").textContent = (st.name || "") + " · " + (st.v || "");
  const pb = st.pb;
  $("pbCard").classList.toggle("hide", !pb);
  if (pb) {
    const names = {WAITING: "等待充电宝", FOREIGN: "不是充电宝", STARTING: "连接中", ONLINE: "已连接", NOREPLY: "无应答", ERROR: "USB 错误"};
    $("pbLink").textContent = names[pb.link] || pb.link;
    const live = pb.soc !== undefined;
    $("pbSoc").textContent = live ? pb.soc : "-";
    $("pbBar").style.width = live ? Math.min(100, pb.soc) + "%" : "0";
    $("pbBar").style.background = !live ? "transparent" : pb.soc <= 20 ? "var(--bad)" : pb.soc <= 50 ? "var(--warn)" : "var(--good)";
    $("pbV").textContent = live ? fmt(pb.mv / 1000, 3) + " V" : "-";
    $("pbI").textContent = live ? (pb.ma > 0 ? "+" : "") + fmt(pb.ma / 1000, 2) + " A" : "-";
    $("pbP").textContent = live ? fmt(pb.mw / 1000, 2) + " W" : "-";
    $("pbT").textContent = live && pb.temp !== null ? fmt(pb.temp, 1) + " °C" : "-";
    $("pbH").textContent = live ? pb.soh + " %" : "-";
    $("pbC").textContent = live && pb.cyc !== null ? pb.cyc + " 次" : "-";
  }
}

async function poll() {
  if (!link || polling) return;
  polling = true;
  try { st = await link.state(); render(); setLink(link.name + " 已连接", "ok"); }
  catch (e) { setLink(link.name + " 无响应", "bad"); }
  polling = false;
}

let timer = 0;
function start(l) {
  link = l;
  $("app").classList.remove("hide");
  $("bleHelp").classList.add("hide");
  $("connect").style.display = "none";
  poll();
  clearInterval(timer);
  timer = setInterval(poll, l === httpLink ? 1000 : 1500);
}

if (location.protocol === "http:" && (location.hostname !== "localhost" || location.search.includes("http"))) {
  start(httpLink);
} else {
  $("bleHelp").classList.remove("hide");
  const btn = $("connect");
  btn.style.display = "block";
  if (!navigator.bluetooth) { btn.disabled = true; btn.textContent = "这个浏览器不支持网页蓝牙"; }
  btn.onclick = async () => {
    try { setLink("连接中…"); await bleLink.open(); start(bleLink); }
    catch (e) { setLink("未连接", "bad"); log("! " + e); }
  };
}
</script>
</body>
</html>
