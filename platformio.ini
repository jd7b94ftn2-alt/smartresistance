[platformio]
default_envs = esp32-s3

[env:esp32-s3]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
; ESP32-S3-WROOM-1-N16R8: 16 MB quad flash + 8 MB octal PSRAM.
board_build.flash_size = 16MB
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
; docs/index.html (the phone web page, also on GitHub Pages) -> include/web_index.h
extra_scripts = pre:tools/embed_web.py
; 16 px Chinese text font for iPhone notifications (tools/make_textfont.py, Noto Sans SC, OFL)
board_build.embed_files = data/font_text16.bin
lib_deps =
    bodmer/TFT_eSPI@2.5.43
    h2zero/NimBLE-Arduino@1.4.2
    knolleary/PubSubClient@2.8
build_flags =
    -D BOARD_HAS_PSRAM
    ; TinyUSB device: one composite USB port = CDC serial (commands/log) + HID (knob).
    ; Not started at boot: comm::begin() starts it in PC mode only; in power-bank mode the same
    ; USB controller runs the ESP-IDF USB host stack instead (src/pbank.cpp).
    -D ARDUINO_USB_MODE=0
    -D ARDUINO_USB_CDC_ON_BOOT=0
    -D CORE_DEBUG_LEVEL=1
    -D USER_SETUP_LOADED=1
    -D ILI9341_DRIVER=1
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=320
    -D TFT_MISO=13
    -D TFT_MOSI=11
    -D TFT_SCLK=12
    -D TFT_CS=10
    -D TFT_DC=9
    -D TFT_RST=14
    -D TOUCH_CS=8
    ; TFT_eSPI on ESP32-S3 with Arduino core 2.0.14+ needs this or it crashes in begin().
    -D USE_HSPI_PORT=1
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=16000000
    -D SPI_TOUCH_FREQUENCY=2500000
    ; Built-in fonts still used: 1 (6x8, serial log) and 7 (7-segment numbers).
    -D LOAD_GLCD=1
    -D LOAD_FONT7=1
    ; Anti-aliased fonts from PROGMEM arrays (include/font_zh16.h, font_zh24.h).
    -D SMOOTH_FONT=1
